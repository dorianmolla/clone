name: Aggiorna Dropbox
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python aggiorna.py
        env:
          DBX_KEY: ${{ secrets.DBX_KEY }}
          DBX_SECRET: ${{ secrets.DBX_SECRET }}
          DBX_REFRESH: ${{ secrets.DBX_REFRESH }}
          RENTRY_URL: ${{ secrets.RENTRY_URL }}
